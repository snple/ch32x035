[package]
name = "ch32x035-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Examples for the CH32X035 HAL"
publish = false

[lib]
name = "ch32x035_examples"
path = "src/common/mod.rs"

[[bin]]
name = "blink"
path = "src/blink.rs"

[[bin]]
name = "hello_uart"
path = "src/hello_uart.rs"

[[bin]]
name = "i2c_slave"
path = "src/i2c_slave.rs"

[[bin]]
name = "usbpd_sink"
path = "src/usbpd_sink.rs"

[[bin]]
name = "usbpd_source"
path = "src/usbpd_source.rs"

[[bin]]
name = "usbpd_dual"
path = "src/usbpd_dual.rs"

[[bin]]
name = "usbpd_sniffer"
path = "src/usbpd_sniffer.rs"

[dependencies]
# Select the CH32X035 sub-model here (see ch32x035::package). The examples
# target the CH32X035F8U6 (QFN20), the most widely used part; change this to
# match your board.
ch32x035 = { workspace = true, default-features = false, features = ["defmt", "critical-section-impl", "panic-handler", "ch32x035f8u6"] }
ch32x035-pac.workspace = true
ch32x035-rt.workspace = true
defmt = { workspace = true }
defmt-rtt = { workspace = true }

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["riscv32imac-unknown-none-elf"]
