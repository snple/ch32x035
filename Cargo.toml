[workspace]
resolver = "2"
members = [
    "xtask",
    "ch32x035",
    "ch32x035-pac",
    "ch32x035-macro",
    "ch32x035-rt",
    "ch32x035-examples",
    "ch32x035-rtos",
    "ch32x035-rtos-macro",
    "ch32x035-usb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snple/ch32x035.git"

[workspace.dependencies]
# Logging
defmt = "1.1"
defmt-rtt = "1.2"

# Macros / code generation
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
paste = "1.0"
enumflags2 = "0.7"

# Local crates
# ch32x035 (HAL) defaults to no features at the workspace level; each
# consumer (examples) explicitly forwards the features it needs.
ch32x035 = { version = "0.1.0", path = "ch32x035", default-features = false }
ch32x035-rt = { version = "0.1.0", path = "ch32x035-rt" }
ch32x035-pac = { version = "0.1.0", path = "ch32x035-pac" }
ch32x035-macro = { version = "0.1.0", path = "ch32x035-macro" }
ch32x035-usb = { version = "0.1.0", path = "ch32x035-usb", default-features = false }
usb-stack = { version = "0.1.0", default-features = false }
ch32x035-rtos = { path = "ch32x035-rtos", default-features = false }
ch32x035-rtos-macro = { path = "ch32x035-rtos-macro" }

critical-section = { version = "1.2", features = ["restore-state-u32"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = 2
