[package]
name = "ch32x035-usb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "USB device stack for the CH32X035 (WCH USBFS full-speed device)"
keywords = ["ch32x035", "wch", "usb", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
ch32x035 = { workspace = true, default-features = false }
usb-stack.workspace = true
defmt = { workspace = true, optional = true }

[features]
default = ["defmt"]
defmt = ["dep:defmt", "ch32x035/defmt", "usb-stack/defmt"]

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["riscv32imac-unknown-none-elf"]
